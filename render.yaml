services:
  - type: web
    name: app-mmse-time
    env: python
    plan: free
    buildCommand: pip install -r suivi-heures-ot/requirements.txt
    startCommand: cd suivi-heures-ot && python main.py
    autoDeploy: true
    envVars:
      # Base PostgreSQL "suivi-heures-db", connectee manuellement dans le
      # dashboard Render (Environment). sync: false = Render ne touche pas
      # a cette valeur lors d'un sync de Blueprint.
      - key: DATABASE_URL
        sync: false
