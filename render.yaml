services:
  - type: web
    name: app-mmse-time
    env: python
    plan: free
    buildCommand: cd suivi-heures-ot && pip install -r requirements.txt
    startCommand: bash start.sh
    autoDeploy: true
    disk:
      name: app-mmse-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_DATA_DIR
        value: /var/data
      - key: RENDER
        value: "true"
