services:
  - type: web
    name: app-mmse-time
    env: python
    plan: free
    buildCommand: pip install -r suivi-heures-ot/requirements.txt
    startCommand: bash start.sh
    autoDeploy: true
    disk:
      name: app-mmse-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: RENDER
        value: "true"
      - key: FORCE_RESET_DB
        value: "false"
