services:
  - type: web
    name: app-mmse-time
    env: python
    plan: free
    buildCommand: pip install -r suivi-heures-ot/requirements.txt
    startCommand: cd suivi-heures-ot && uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}
    autoDeploy: true
    envVars:
      - key: RENDER
        value: "true"
      - key: FORCE_RESET_DB
        value: "false"
